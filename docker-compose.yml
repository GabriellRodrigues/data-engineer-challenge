services:
  pipeline:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_PATH=/app/data/landing
      - LOG_LEVEL=INFO
      - ENVIRONMENT=local
    volumes:
      - ./docs/sample-data:/app/docs/sample-data:ro
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./src:/app/src
      - ./etl_jobs:/app/etl_jobs
      - ./data:/app/data
    command: tail -f /dev/null
