apiVersion: v3.0.2
kind: DataContract
id: settlement.silver.reconciliation_results_quarantine
name: reconciliation_results_quarantine
version: 1.0.0
status: active
domain: settlement
dataProduct: settlement_reconciliation
description:
  purpose: Reconciliation results that cannot be attributed to a run, kept out of the analytical tables.
  usage: Referential integrity monitoring (C5) and investigation by the data team.
  limitations: Rebuilt in full on every Silver run; rows leave the quarantine as soon as their run arrives in Bronze.
schema:
  - name: reconciliation_results_quarantine
    physicalName: reconciliation_results_quarantine
    physicalType: table
    logicalType: object
    description: One row per (run_id, transaction_id) without a valid run.
    properties:
      - {name: run_id, logicalType: integer, physicalType: bigint, required: true, primaryKey: true, primaryKeyPosition: 1, description: Run referenced by the result.}
      - {name: transaction_id, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 2, description: Reconciled transaction.}
      - {name: result_id, logicalType: integer, physicalType: bigint, required: true, description: Identifier of the kept result row in the source.}
      - {name: merchant_id, logicalType: string, physicalType: varchar, required: false, description: Merchant identifier in upper case; filled from the internal transaction or the settlement when the result has none.}
      - {name: merchant_id_origin, logicalType: string, physicalType: varchar, required: false, description: "Where merchant_id came from (result, transaction, settlement); null when unknown."}
      - {name: category, logicalType: string, physicalType: varchar, required: true, description: Category assigned by the service.}
      - {name: internal_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Internal amount.}
      - {name: processor_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Processor amount.}
      - {name: difference, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Absolute difference between both amounts.}
      - {name: created_at, logicalType: date, physicalType: timestamp, required: true, description: Result creation time (UTC).}
      - {name: source_row_count, logicalType: integer, physicalType: bigint, required: true, description: Rows found in the source for this key before deduplication.}
      - {name: _quarantine_reason, logicalType: string, physicalType: varchar, required: true, description: Why the row is quarantined (run_not_found).}
      - {name: _source_file, logicalType: string, physicalType: varchar, required: true, description: Source file of the Bronze row.}
      - {name: _bronze_run_id, logicalType: string, physicalType: varchar, required: true, description: Bronze run that loaded the row (lineage only).}
      - {name: _bronze_ingested_at, logicalType: date, physicalType: timestamp, required: true, description: When the row was loaded into Bronze.}
      - {name: _silver_run_id, logicalType: string, physicalType: varchar, required: true, description: Silver run that published the row.}
      - {name: _silver_built_at, logicalType: date, physicalType: timestamp, required: true, description: When the Silver run computed the row.}
