apiVersion: v3.0.2
kind: DataContract
id: settlement.gold.audit_reconciliation_recheck
name: audit_reconciliation_recheck
version: 1.0.0
status: active
domain: settlement
dataProduct: settlement_reconciliation
description:
  purpose: Independent recomputation of the reconciliation compared with the verdicts of the service.
  usage: Compliance and Operations evidence that the service verdicts follow the business rules (7-day window, R$ 0.01 tolerance).
  limitations: Only for reference runs whose date has a settlement file in Silver. Uses the current state of internal transactions (non-deleted, any status), so later CDC changes can differ from what the service saw.
schema:
  - name: audit_reconciliation_recheck
    physicalName: audit_reconciliation_recheck
    physicalType: table
    logicalType: object
    description: One row per run_id and transaction_id; partitioned by reference_date.
    properties:
      - {name: reference_date, logicalType: date, physicalType: date, required: true, description: Business date of the run; partition column.}
      - {name: run_id, logicalType: integer, physicalType: bigint, required: true, primaryKey: true, primaryKeyPosition: 1, description: Reference run of the date.}
      - {name: transaction_id, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 2, description: "Transaction judged by the service, the recomputation or both."}
      - {name: service_category, logicalType: string, physicalType: varchar, required: false, description: Category stored by the service; null when it did not judge the transaction.}
      - {name: recomputed_category, logicalType: string, physicalType: varchar, required: false, description: Category from the recomputation; null when neither side was found.}
      - {name: service_internal_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Internal amount stored by the service.}
      - {name: service_processor_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Processor amount stored by the service.}
      - {name: recomputed_internal_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Internal amount found by the recomputation.}
      - {name: recomputed_processor_amount, logicalType: number, physicalType: "decimal(18,2)", required: false, description: Processor amount found by the recomputation.}
      - {name: outcome, logicalType: string, physicalType: varchar, required: true, description: "agrees, category_differs, missing_in_service or missing_in_recompute."}
      - {name: _gold_run_id, logicalType: string, physicalType: varchar, required: true, description: Gold run that published the row.}
      - {name: _gold_built_at, logicalType: date, physicalType: timestamp, required: true, description: When the Gold run computed the row.}
