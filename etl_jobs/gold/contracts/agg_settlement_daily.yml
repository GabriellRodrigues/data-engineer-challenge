apiVersion: v3.0.2
kind: DataContract
id: settlement.gold.agg_settlement_daily
name: agg_settlement_daily
version: 1.0.0
status: active
domain: settlement
dataProduct: settlement_reconciliation
description:
  purpose: Settled, reversed and net volume per settlement day.
  usage: Settled volume (F5) and reversal rate (F6) for the CFO.
  limitations: By settled_date; the challenge sample covers a single day.
schema:
  - name: agg_settlement_daily
    physicalName: agg_settlement_daily
    physicalType: table
    logicalType: object
    description: One row per settled_date, processor and currency.
    properties:
      - {name: settled_date, logicalType: date, physicalType: date, required: true, primaryKey: true, primaryKeyPosition: 1, description: UTC settlement date.}
      - {name: processor, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 2, description: Processor.}
      - {name: currency, logicalType: string, physicalType: varchar, required: true, primaryKey: true, primaryKeyPosition: 3, description: ISO 4217 currency.}
      - {name: settled_count, logicalType: integer, physicalType: bigint, required: true, description: SETTLED lines.}
      - {name: settled_amount, logicalType: number, physicalType: "decimal(18,2)", required: true, description: Amount of SETTLED lines.}
      - {name: reversed_count, logicalType: integer, physicalType: bigint, required: true, description: REVERSED lines.}
      - {name: reversed_amount, logicalType: number, physicalType: "decimal(18,2)", required: true, description: Amount of REVERSED lines.}
      - {name: net_amount, logicalType: number, physicalType: "decimal(18,2)", required: true, description: settled_amount minus reversed_amount.}
      - {name: reversal_rate, logicalType: number, physicalType: double, required: true, description: REVERSED lines / all lines.}
      - {name: reversal_amount_rate, logicalType: number, physicalType: double, required: false, description: REVERSED amount / total amount.}
      - {name: without_internal_count, logicalType: integer, physicalType: bigint, required: true, description: Lines without an internal transaction.}
      - {name: _gold_run_id, logicalType: string, physicalType: varchar, required: true, description: Gold run that published the row.}
      - {name: _gold_built_at, logicalType: date, physicalType: timestamp, required: true, description: When the Gold run computed the row.}
